<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<title>Snap Downloader Bot</title>
<style>
body { font-family: sans-serif; text-align: center; padding: 40px; background: #f3f3f3; }
input, button { padding: 10px; margin: 5px; width: 300px; }
button { cursor: pointer; background: #2196f3; color: white; border: none; border-radius: 5px; }
</style>
</head>
<body>

<h1>   Snap </h1>

<form id="snapForm">
<input type="text" id="chat_id" placeholder="ID  " required><br>
<input type="text" id="url" placeholder=" Snap / Story" required><br>
<button type="submit"> & </button>
</form>

<script>
const snapForm = document.getElementById('snapForm');
snapForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const chat_id = document.getElementById('chat_id').value;
    const url = document.getElementById('url').value;
    const res = await fetch('https://your-railway-url/snap', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id, url})
    });
    const data = await res.json();
    alert(data.status + ": " + (data.message || ""));
});
</script>

</body>
</html>
